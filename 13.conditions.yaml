- name: even or odd
  hosts: local
  connection: local
  vars:
   given_number: 10
  tasks:
  - name: is even
    debug:
      msg: "{{given_number}} is an even number"
    when: given_number % 2 == 0 # expression
  - name: is odd
    debug:
      msg: "{{given_number}} is an even number"
    when: given_number % 2 != 0