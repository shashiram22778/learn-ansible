- name: error handiling for roboshop user
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: check if user exists?
    command: id roboshop
    register: user_output
    ignore_errors: yes
  - name: print the previosu task output
    debug:
      msg: "{{user_output}}"
  - name: create user if it dont exists
    command: adduser roboshop
    when: user_output.rc != 0    


